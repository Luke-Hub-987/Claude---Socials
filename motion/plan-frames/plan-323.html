<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3:23 Plan Frames</title>
<style>
/* ERN site theme, as the New York frames: navy, cream strip, ERN blue, gold numbers */
:root{
  --navy:#0c1828; --navy-2:#14253d; --cream:#f4efe6; --blue:#1f7ae0; --blue-d:#1559ad; --blue-l:#6fb2ff;
  --gold:#f5b52e; --muted:#9fb0c6; --red:#ff8a80; --grey:#c3cbd6; --ink:#0d1726;
}
@font-face{font-family:'DM Serif Display';src:url(../fonts/DMSerifDisplay-400-normal.woff2) format('woff2');}
@font-face{font-family:'DM Serif Display';font-style:italic;src:url(../fonts/DMSerifDisplay-400-italic.woff2) format('woff2');}
@font-face{font-family:Barlow;font-weight:700;src:url(../fonts/BarlowCondensed-700-normal.woff2) format('woff2');}
@font-face{font-family:Barlow;font-weight:800;src:url(../fonts/BarlowCondensed-800-normal.woff2) format('woff2');}
@font-face{font-family:Inter;src:url(../fonts/Inter-400-normal.woff2) format('woff2');font-weight:100 900;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
#f{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--navy);color:#fff;font-family:Barlow,sans-serif}

/* the race strip: the same in every frame */
.strip{position:absolute;left:0;top:0;right:0;height:150px;background:var(--cream)}
.strip svg{position:absolute;left:0;top:0}
.strip img{position:absolute;right:56px;top:22px;height:106px;border-radius:6px}
.tk{font-family:Barlow,sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;fill:var(--ink)}
.tk.on{fill:var(--blue)}

.body{position:absolute;left:96px;right:96px;top:196px;bottom:56px}
.eyebrow{font-weight:800;font-size:46px;letter-spacing:4px;color:var(--blue-l)}
.head{font-weight:800;font-size:104px;line-height:.95;letter-spacing:1px;margin-top:6px}
.pace{display:flex;align-items:baseline;gap:14px;margin-top:34px}
.pace .n{font-weight:700;font-size:180px;line-height:.85;color:var(--gold)}
.pace .u{font-weight:800;font-size:60px;color:var(--gold)}
.mi{font-weight:700;font-size:50px;color:var(--muted);margin-top:14px}
.serif{font-family:'DM Serif Display',serif;font-weight:400;letter-spacing:-.3px;line-height:1.08}
.serif em{font-style:italic;color:var(--blue-l)}
.serif b{font-family:Barlow,sans-serif;font-weight:700;color:var(--gold);letter-spacing:0}
.line{display:flex;align-items:center;gap:22px;font-weight:700;font-size:50px;line-height:1.1}
.line .lab{font-weight:800;color:var(--blue-l);letter-spacing:2px}
.line .n{color:var(--gold)}
.card{background:var(--navy-2);border-radius:28px;padding:40px 44px}
.card.cream{background:var(--cream);color:var(--ink)}
.card.blue{background:var(--blue)}
.chip{display:inline-block;font-weight:800;font-size:32px;letter-spacing:3px;color:var(--gold);border:3px solid var(--gold);border-radius:999px;padding:6px 22px 4px}
table{width:100%;border-collapse:collapse}
th{font-weight:800;font-size:32px;letter-spacing:2px;color:var(--muted);text-align:left;padding:0 0 14px}
td{font-weight:700;font-size:48px;padding:16px 0;border-top:2px solid rgba(255,255,255,.09);vertical-align:middle}
td.g{color:var(--gold)} td.m{color:var(--muted)} td.c{font-size:40px}
.cta{position:absolute;right:0;bottom:0;background:var(--blue);border-radius:16px;padding:16px 28px 14px;font-weight:800;font-size:32px;letter-spacing:1.5px}
</style>
</head>
<body>
<div id="f">
  <div class="strip"><svg id="strip" width="1920" height="150" viewBox="0 0 1920 150"></svg><img src="../brand/ern-logo.png" alt="ERN"></div>
  <div class="body" id="b"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n}
const KM=42.195, X0=110, X1=1610, X=k=>X0+(X1-X0)*k/KM, Y=62;
const MARKS=[[0,'START'],[10,'10K'],[KM/2,'HALF'],[30,'30K'],[KM,'FINISH']];
function strip(a,b){const s=document.getElementById('strip');s.innerHTML='';
  el('line',{x1:X0,y1:Y,x2:X1,y2:Y,stroke:'#c3cbd6','stroke-width':12,'stroke-linecap':'round'},s);
  el('line',{x1:X(a),y1:Y,x2:X(b),y2:Y,stroke:'#1f7ae0','stroke-width':20,'stroke-linecap':'round'},s);
  for(const [k,t] of MARKS){const on=k>=a-0.01&&k<=b+0.01;
    el('circle',{cx:X(k),cy:Y,r:11,fill:on?'#1f7ae0':'#0d1726',stroke:'#f4efe6','stroke-width':4},s);
    const tx=el('text',{x:X(k),y:122,'text-anchor':k===0?'start':k===KM?'end':'middle',class:'tk'+(on?' on':'')},s);
    tx.setAttribute('x',k===0?X0-10:k===KM?X1+10:X(k));tx.textContent=t}}

/* frame 1: the road and the two flags */
function road(){return `<svg width="900" height="620" viewBox="0 0 900 620" style="position:absolute;right:0;top:40px">
  <rect x="0" y="0" width="900" height="620" rx="28" fill="#14253d"/>
  <rect x="0" y="470" width="900" height="70" fill="#22344f"/>
  <line x1="30" y1="505" x2="870" y2="505" stroke="#9fb0c6" stroke-width="4" stroke-dasharray="26 22" opacity=".5"/>
  <!-- far ahead, faded: the 3:15 flag -->
  <g opacity=".55">
    <line x1="770" y1="470" x2="770" y2="210" stroke="#ff8a80" stroke-width="7" stroke-linecap="round"/>
    <rect x="770" y="210" width="118" height="72" rx="6" fill="#ff8a80"/>
    <text x="829" y="261" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="44" fill="#0c1828">3:15</text>
  </g>
  <text x="840" y="170" text-anchor="end" font-family="Barlow" font-weight="800" font-size="42" fill="#ff8a80" letter-spacing="1">13 s/K too fast</text>
  <!-- just ahead of the runner: the 3:30 flag -->
  <line x1="330" y1="470" x2="330" y2="150" stroke="#f4efe6" stroke-width="9" stroke-linecap="round"/>
  <rect x="330" y="150" width="170" height="104" rx="8" fill="#1f7ae0"/>
  <text x="415" y="224" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="66" fill="#fff">3:30</text>
  <!-- the runner, a step behind -->
  <g transform="translate(200,470)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0 L22 -60 L4 -112" stroke="#f1c7a3" stroke-width="15"/>
    <path d="M0 0" stroke="#f1c7a3"/>
    <path d="M-38 -8 L-14 -56 L4 -112" stroke="#d8b08e" stroke-width="15"/>
    <path d="M8 -112 L20 -190" stroke="#1f7ae0" stroke-width="40"/>
    <path d="M18 -178 L46 -150 L70 -168" stroke="#f1c7a3" stroke-width="12"/>
    <path d="M14 -176 L-12 -146 L-30 -160" stroke="#d8b08e" stroke-width="12"/>
    <circle cx="28" cy="-222" r="22" fill="#f1c7a3" stroke="none"/>
    <path d="M8 -232 A22 22 0 0 1 48 -228 Z" fill="#6b4528" stroke="none"/>
    <path d="M-2 -2 L12 0 M-46 -4 L-32 -4" stroke="#f5b52e" stroke-width="13"/>
  </g>
</svg>`}

const FRAMES={
 1:{s:[0,10],h:`
   <div style="position:absolute;left:0;top:0;width:860px">
     <div class="eyebrow">0-10K</div>
     <div class="head">THE SLOWER FLAG</div>
     <div class="pace"><span class="n">4:55-5:00</span><span class="u">/K</span></div>
     <div class="mi">(7:55-8:03 /mile)</div>
   </div>
   ${road()}
   <div style="position:absolute;left:0;bottom:0;right:0;display:flex;gap:28px">
     <div class="card line" style="flex:1"><span class="lab">FIRST GEL</span><span class="n">20 min</span></div>
     <div class="card line serif" style="flex:1;font-size:56px">10K check: <b>49-50 min</b></div>
   </div>`},
 2:{s:[10,KM/2],h:`
   <div style="position:absolute;left:0;top:0;width:860px">
     <div class="eyebrow">10K TO HALFWAY</div>
     <div class="head">GOAL PACE</div>
     <div class="pace"><span class="n">4:45-4:50</span><span class="u">/K</span></div>
     <div class="mi">(7:39-7:47 /mile)</div>
   </div>
   <div style="position:absolute;right:0;top:40px;width:820px;display:flex;flex-direction:column;gap:26px">
     <div class="card" style="font-weight:700;font-size:56px;line-height:1.15">A gel every <span style="color:#f5b52e">30 min</span> + <span style="color:#f5b52e">3-4</span> sips of water</div>
     <div class="card" style="font-weight:700;font-size:56px;line-height:1.15">About <span style="color:#f5b52e">60g</span> of carbs an hour</div>
   </div>
   <div class="card serif" style="position:absolute;left:0;right:0;bottom:0;font-size:60px">Halfway: about <b>1:43</b>, around a minute behind <b>3:23</b> pace</div>`},
 3:{s:[KM/2,30],h:`
   <div style="position:absolute;left:0;top:0;width:860px">
     <div class="eyebrow">HALFWAY TO 30K</div>
     <div class="head">LEAVE THE MINUTE</div>
     <div class="pace"><span class="n">4:45-4:50</span><span class="u">/K</span></div>
     <div class="chip" style="margin-top:26px">THE SAME PACE</div>
   </div>
   <div class="card cream" style="position:absolute;right:0;top:40px;width:820px;height:420px;display:flex;align-items:center">
     <div class="serif" style="font-size:104px;color:#0d1726">Don’t chase the minute <em style="color:#1f7ae0">back.</em></div>
   </div>
   <div class="card line" style="position:absolute;left:0;right:0;bottom:0"><span class="lab">30K CHECK</span><span>about <span class="n">2:25</span> = on for <span class="n">3:23</span></span></div>`},
 4:{s:[30,KM],h:`
   <div class="eyebrow">30K TO THE FINISH</div>
   <div style="display:flex;align-items:baseline;gap:34px"><div class="head">IF THE WALL COMES</div><div class="serif" style="font-size:60px;color:#6fb2ff"><em>in this order</em></div></div>
   <div style="position:absolute;left:0;right:0;bottom:0;top:250px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px">
     ${[['1','Something sweet + something to drink',''],['2','15-20 s/K slower for 10 minutes, shorter, quicker steps',''],['3','Back to 4:45-4:50, one K at a time','blue']].map(([n,t,c])=>`
       <div class="card ${c}" style="display:flex;flex-direction:column;gap:22px">
         <div style="font-weight:700;font-size:150px;line-height:.85;color:${c?'#fff':'#f5b52e'}">${n}</div>
         <div style="font-weight:700;font-size:54px;line-height:1.12">${t}</div></div>`).join('')}
   </div>`},
 5:{s:[0,KM],h:`
   <div style="display:flex;align-items:baseline;gap:30px"><div class="eyebrow">THE WHOLE PLAN</div><div class="chip">3:23</div></div>
   <div class="card" style="margin-top:22px;padding:30px 44px 18px">
     <table>
       <tr><th>SECTION</th><th>PACE PER K</th><th>PACE PER MILE</th><th>CHECK</th></tr>
       <tr><td>0-10K</td><td class="g">4:55-5:00</td><td class="m">7:55-8:03</td><td class="c">10K in 49-50 min</td></tr>
       <tr><td>10K-half</td><td class="g">4:45-4:50</td><td class="m">7:39-7:47</td><td class="c">half in about 1:43</td></tr>
       <tr><td>half-30K</td><td class="g">4:45-4:50</td><td class="m">7:39-7:47</td><td class="c">30K in about 2:25</td></tr>
       <tr><td>30K-finish</td><td class="g">4:45-4:50</td><td class="m">7:39-7:47</td><td class="c">if the wall: 10 min easier, then back</td></tr>
     </table>
   </div>
   <div class="serif" style="font-size:44px;margin-top:26px;width:1150px">Fuel: first gel at <b>20 min</b>, then every <b>30 min</b> (about <b>60g</b> an hour). Carry <b>7</b>: 6 on the clock + 1 spare.</div>
   <div class="cta">Your plan, free: email us your race and goal, link in bio</div>`},
};
window.render=function(n){const fr=FRAMES[n];strip(...fr.s);document.getElementById('b').innerHTML=fr.h};
const q=new URLSearchParams(location.search);if(q.has('f'))render(+q.get('f'));else render(1);
</script>
</body>
</html>
