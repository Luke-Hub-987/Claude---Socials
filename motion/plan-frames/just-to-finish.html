<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Just To Finish Frames</title>
<style>
/* ERN site theme, as the New York and where-it-goes-wrong frames: navy, cream strip, ERN blue, gold numbers, red only for 4:02 */
:root{
  --navy:#0c1828; --navy-2:#14253d; --cream:#f4efe6; --blue:#1f7ae0; --blue-l:#6fb2ff;
  --gold:#f5b52e; --muted:#9fb0c6; --red:#ff8a80; --ink:#0d1726;
}
@font-face{font-family:'DM Serif Display';src:url(../fonts/DMSerifDisplay-400-normal.woff2) format('woff2');}
@font-face{font-family:Barlow;font-weight:700;src:url(../fonts/BarlowCondensed-700-normal.woff2) format('woff2');}
@font-face{font-family:Barlow;font-weight:800;src:url(../fonts/BarlowCondensed-800-normal.woff2) format('woff2');}
@font-face{font-family:Caveat;font-weight:700;src:url(../fonts/Caveat-700-normal.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
#f{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--navy);color:#fff;font-family:Barlow,sans-serif}

/* the race strip, marked at the K signs the hand plan uses */
.strip{position:absolute;left:0;top:0;right:0;height:150px;background:var(--cream)}
.strip svg{position:absolute;left:0;top:0}
.strip img{position:absolute;right:56px;top:22px;height:106px;border-radius:6px}
.tk{font-family:Barlow,sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;fill:var(--ink)}
.tk.on{fill:var(--blue)}

.body{position:absolute;left:96px;right:96px;top:196px;bottom:56px}
.eyebrow{font-weight:800;font-size:46px;letter-spacing:4px;color:var(--blue-l)}
.head{font-weight:800;font-size:104px;line-height:.95;letter-spacing:1px;margin-top:6px}
.pace{display:flex;align-items:baseline;gap:14px;margin-top:30px}
.pace .n{font-weight:700;font-size:170px;line-height:.85;color:var(--gold)}
.pace .u{font-weight:800;font-size:60px;color:var(--gold)}
.mi{font-weight:700;font-size:46px;color:var(--muted);margin-top:12px}
.card{background:var(--navy-2);border-radius:28px;padding:30px 40px}
.line{display:flex;align-items:center;gap:22px;font-weight:700;font-size:48px;line-height:1.1}
.line .lab{font-weight:800;color:var(--blue-l);letter-spacing:2px;white-space:nowrap}
.line .n{color:var(--gold)}
.serif{font-family:'DM Serif Display',serif;font-weight:400;line-height:1.1}
.chip{display:inline-block;font-weight:800;font-size:32px;letter-spacing:3px;color:var(--gold);border:3px solid var(--gold);border-radius:999px;padding:6px 22px 4px}

/* the hand plan: what you write before the start line */
.hand{position:absolute;right:0;top:0;width:640px;background:var(--cream);color:var(--ink);border-radius:32px;padding:32px 46px 26px}
.hand .t{font-weight:800;font-size:40px;letter-spacing:5px;color:var(--blue);text-align:center}
.hand .r{display:flex;align-items:center;height:118px;border-top:3px solid #e3dccf}
.hand .r:first-of-type{border-top:0}
.hand .i{font-family:Caveat,cursive;font-weight:700;font-size:70px;width:64px;color:#7a8597}
.hand .k{font-weight:800;font-size:46px;width:120px;color:var(--blue)}
.hand .v{font-family:Caveat,cursive;font-weight:700;font-size:100px;line-height:1}
.hand .v.blank{flex:1;height:0;border-bottom:6px solid #c9c1b3;margin-top:44px}
.hand .r.now .v{color:var(--blue)}
.cta{position:absolute;right:0;bottom:0;background:var(--blue);border-radius:16px;padding:16px 28px 14px;font-weight:800;font-size:32px;letter-spacing:1.5px}

/* the watch */
.watch{position:absolute}
.watch .band{position:absolute;left:50%;background:var(--navy-2)}
.watch .case{position:absolute;inset:0;border-radius:22%;background:#223149}
.watch .scr{position:absolute;inset:4%;border-radius:19%;background:#05080d;display:flex;flex-direction:column;align-items:center;justify-content:center}
.watch .lab{font-weight:800;letter-spacing:.16em;color:var(--muted)}
.watch .time{font-weight:800;line-height:.9;color:var(--red)}
</style>
</head>
<body>
<div id="f">
  <div class="strip" id="stripbox"><svg id="strip" width="1920" height="150" viewBox="0 0 1920 150"></svg><img src="../brand/ern-logo.png" alt="ERN"></div>
  <div class="body" id="b"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n}
const KM=42.195, X0=110, X1=1540, X=k=>X0+(X1-X0)*k/KM, Y=62;
const MARKS=[[0,'START'],[10,'10K'],[20,'20K'],[30,'30K'],[40,'40K'],[KM,'FINISH']];
function strip(a,b){const s=document.getElementById('strip');s.innerHTML='';
  el('line',{x1:X0,y1:Y,x2:X1,y2:Y,stroke:'#c3cbd6','stroke-width':12,'stroke-linecap':'round'},s);
  el('line',{x1:X(a),y1:Y,x2:X(b),y2:Y,stroke:'#1f7ae0','stroke-width':20,'stroke-linecap':'round'},s);
  for(const [k,t] of MARKS){const on=k>=a-0.01&&k<=b+0.01;
    el('circle',{cx:X(k),cy:Y,r:11,fill:on?'#1f7ae0':'#0d1726',stroke:'#f4efe6','stroke-width':4},s);
    const fin=k===KM;const tx=el('text',{x:k===0?X0-10:fin?X1+24:X(k),y:fin?Y+11:122,'text-anchor':k===0||fin?'start':'middle',class:'tk'+(on?' on':'')},s);
    tx.textContent=t}}

/* the hand plan card: filled = how many numbers have been given so far, now = the ones this stage adds */
const PLAN=[['10K','57:30'],['20K','1:54'],['30K','2:50'],['40K','3:46']];
function hand(filled,now,style){return `<div class="hand" style="${style||''}"><div class="t">THE HAND PLAN</div>
  ${PLAN.map(([k,v],i)=>`<div class="r${now.includes(i)?' now':''}"><div class="i">${i+1}</div>${i<filled?`<div class="k">${k}</div><div class="v">${v}</div>`:'<div class="v blank"></div>'}</div>`).join('')}</div>`}

function watch(x,y,w,label,time){const h=w*0.97;return `<div class="watch" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
  <div class="band" style="width:${w*.52}px;margin-left:${-w*.26}px;top:${-h*.13}px;height:${h*.2}px;border-radius:${w*.06}px ${w*.06}px 0 0"></div>
  <div class="band" style="width:${w*.52}px;margin-left:${-w*.26}px;bottom:${-h*.13}px;height:${h*.2}px;border-radius:0 0 ${w*.06}px ${w*.06}px"></div>
  <div class="case"><div class="scr"><div class="lab" style="font-size:${w*.072}px">${label}</div><div class="time" style="font-size:${w*.46}px;margin-top:${w*.015}px">${time}</div></div></div></div>`}

const FRAMES={
 1:{nostrip:true,h:`
   ${watch(130,181,720,'FINISH','4:02')}
   <div style="position:absolute;left:980px;top:330px;width:760px">
     <div class="eyebrow">SUB-4 PACE</div>
     <div class="head" style="font-size:120px">ON YOUR<br>WATCH</div>
     <div class="serif" style="font-size:64px;margin-top:40px;color:#9fb0c6">can still get you a <span style="color:#ff8a80;font-family:Barlow;font-weight:800">4:02</span></div>
   </div>`},
 2:{s:[0,10],h:`
   <div style="position:absolute;left:0;top:0;width:1000px">
     <div class="eyebrow">START TO 10K</div>
     <div class="head">LET THEM GO PAST</div>
     <div class="pace"><span class="n">5:40-5:45</span><span class="u">/K</span></div>
     <div class="mi">(9:07-9:15 /mile) &middot; on your watch &middot; too easy</div>
   </div>
   ${hand(1,[0])}
   <div style="position:absolute;left:0;right:690px;bottom:0;display:flex;gap:24px;white-space:nowrap">
     <div class="card line" style="flex:1.1;font-size:46px"><span class="lab">FIRST GEL</span><span><span class="n">30g</span> at <span class="n">20 min</span></span></div>
     <div class="card line" style="flex:1;font-size:46px"><span class="lab">THEN</span><span>one every <span class="n">30 min</span></span></div>
   </div>`},
 3:{s:[10,30],h:`
   <div style="position:absolute;left:0;top:0;width:1000px">
     <div class="eyebrow">10K TO 30K</div>
     <div class="head">CHECK EVERY SIGN</div>
     <div class="pace"><span class="n">5:30-5:35</span><span class="u">/K</span></div>
     <div class="mi">(8:51-8:59 /mile) &middot; a gel every 30 min &middot; water as you pass</div>
   </div>
   ${hand(3,[1,2])}
   <div class="card line" style="position:absolute;left:0;right:690px;bottom:0;font-size:46px"><span class="lab" style="color:#ff8a80">30 S BEHIND?</span><span>run <span class="n">5:30</span> until you're back</span></div>`},
 4:{s:[30,KM],h:`
   <div style="position:absolute;left:0;top:0;width:1000px">
     <div class="eyebrow">30K TO THE FINISH</div>
     <div class="head">TRUST THE SIGNS</div>
     <div style="display:flex;align-items:center;gap:40px;margin-top:30px">
       ${'<div style="position:relative;width:250px;height:243px">'+watch(0,0,250,'WATCH','4:02')+'</div>'}
       <div class="serif" style="font-size:56px;width:640px">Your watch reads a bit long. The signs are <span style="color:#f5b52e;font-family:Barlow;font-weight:800">measured</span>.</div>
     </div>
   </div>
   ${hand(4,[3])}
   <div style="position:absolute;left:0;right:690px;bottom:0;display:flex;flex-direction:column;gap:20px">
     <div class="card line" style="font-size:44px"><span class="lab">FROM 30K</span><span>2 or 3 words between breaths</span></div>
     <div class="card line" style="font-size:44px"><span class="lab">STEPS</span><span>shorter, quicker &middot; <span class="n">5:30-5:35</span></span></div>
   </div>`},
 5:{s:[0,KM],h:`
   <div style="position:absolute;left:0;top:0;width:1000px">
     <div style="display:flex;align-items:baseline;gap:26px"><div class="eyebrow">SUB-4</div><div class="chip">SAVE THIS</div></div>
     <div class="head" style="font-size:112px">WRITE IT ON<br>YOUR HAND</div>
     <div class="serif" style="font-size:52px;margin-top:30px;color:#c3cbd6">Look at your watch at each sign.<br><span style="color:#f5b52e;font-family:Barlow;font-weight:800">3:46</span> or less at 40K and you're under&nbsp;4&nbsp;hours.</div>
   </div>
   ${hand(4,[0,1,2,3],'top:0')}
   <div class="cta" style="right:auto;left:0">Not sub-4? Email us your race and goal time, link in bio</div>`},
};
window.render=function(n){const fr=FRAMES[n];
  document.getElementById('stripbox').style.display=fr.nostrip?'none':'';
  if(!fr.nostrip)strip(fr.s[0],fr.s[1]);
  const b=document.getElementById('b');b.style.top=fr.nostrip?'0':'196px';b.innerHTML=fr.h};
const q=new URLSearchParams(location.search);if(q.has('f'))render(+q.get('f'));else render(1);
</script>
</body>
</html>
