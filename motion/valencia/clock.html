<!doctype html><html><head><meta charset="utf-8"><title>Valencia clock</title>
<style>
@font-face{font-family:'BC';font-weight:800;src:url(../fonts/BarlowCondensed-800-normal.woff2) format('woff2')}
@font-face{font-family:'B';font-weight:700;src:url(../fonts/Barlow-700-normal.woff2) format('woff2')}
body{margin:0;width:1920px;height:1080px;background:#fff;font-family:'B';color:#0c1828;position:relative;overflow:hidden}
h1{font-family:'BC';font-weight:800;font-size:110px;margin:0;position:absolute;left:90px;top:60px;letter-spacing:-1px}
h1 span{background:#d9473f;color:#fff;padding:0 18px;border-radius:12px}
.sub{position:absolute;left:94px;top:196px;font-size:40px;color:#5b6474}
table{position:absolute;left:90px;right:90px;top:280px;border-collapse:collapse;width:1740px}
th{font-family:'BC';font-weight:800;font-size:48px;text-align:left;padding:14px 10px;color:#5b6474;border-bottom:5px solid #0c1828}
td{font-family:'BC';font-weight:800;font-size:76px;padding:22px 10px;border-bottom:3px solid #e3e7ee}

.own{position:absolute;left:90px;right:90px;bottom:70px;background:#0c1828;color:#fff;border-radius:18px;padding:26px 36px;font-family:'BC';font-weight:800;font-size:58px}
.own b{color:#f5b52e}
.logo{position:absolute;right:90px;top:80px;height:70px}

<h1>THE VALENCIA <span>CLOCK</span></h1>
<div class="sub">When the course gels reach you (16.2K · 25.8K · 34K), by goal time</div>
<img class="logo" src="../brand/ern-logo.png">
<table>
<tr><th>GOAL</th><th>16.2K</th><th>25.8K</th><th>34K</th></tr>
<tr><td>3:45</td><td class="g">1:27</td><td class="g">2:18</td><td class="g">3:02</td></tr>
<tr><td>SUB-4</td><td class="g">1:33</td><td class="g">2:27</td><td class="g">3:13</td></tr>
<tr><td>4:30</td><td class="g">1:44</td><td class="g">2:45</td><td class="g">3:36</td></tr>
</table>
<div class="own">YOUR OWN GELS: <b>0:20</b>, THEN EVERY <b>30 MINUTES</b>. THE COURSE GELS ARE SPARES.</div>
<script>document.fonts.ready.then(()=>document.title='ready')</script>
</body></html>
