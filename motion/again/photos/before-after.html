<!doctype html><html><head><meta charset="utf-8"><title>ba</title>
<style>
@font-face{font-family:'BC';font-weight:800;src:url(../../fonts/BarlowCondensed-800-normal.woff2) format('woff2')}
body{margin:0;background:#fff;overflow:hidden;font-family:'BC'}
