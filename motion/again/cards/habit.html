<!doctype html><html><head><meta charset="utf-8"><title>habit card</title>
<style>
@font-face{font-family:'BC';font-weight:800;src:url(../../fonts/BarlowCondensed-800-normal.woff2) format('woff2')}
@font-face{font-family:'B';font-weight:700;src:url(../../fonts/Barlow-700-normal.woff2) format('woff2')}
body{margin:0;width:1920px;height:1080px;background:#fff;color:#0c1828;position:relative;overflow:hidden;font-family:'B'}
.num{position:absolute;left:110px;top:90px;font-family:'BC';font-weight:800;font-size:120px;color:#d9473f;letter-spacing:-2px}
.num span{color:#9aa3b2;font-size:80px}
.logo{position:absolute;right:110px;top:110px;height:80px}
h1{position:absolute;left:110px;right:110px;top:270px;margin:0;font-family:'BC';font-weight:800;font-size:170px;line-height:1.16;letter-spacing:-1px}
h1 b{background:#d9473f;color:#fff;padding:0 18px;border-radius:14px;font-weight:800;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{position:absolute;left:114px;right:110px;bottom:190px;font-size:54px;color:#3b4555;line-height:1.25}
.dots{position:absolute;left:110px;bottom:90px;display:flex;gap:18px}
.dots i{width:120px;height:18px;border-radius:9px;background:#e3e7ee;display:block}
.dots i.on{background:#0c1828}.dots i.now{background:#d9473f}
</style></head><body>
<div class="num" id="n"></div><img class="logo" src="../../brand/ern-logo.png">
<h1 id="h"></h1><div class="sub" id="s"></div><div class="dots" id="d"></div>
<script>
const q=new URLSearchParams(location.search), n=+q.get('n'), red=q.get('red')||'';
document.getElementById('n').innerHTML=n+'<span>/10</span>';
let h=q.get('h'); if(red) h=h.replace(red,'<b>'+red+'</b>'); document.getElementById('h').innerHTML=h;
document.getElementById('s').textContent=q.get('s')||'';
document.getElementById('d').innerHTML=Array.from({length:10},(_,i)=>'<i class="'+(i+1<n?'on':i+1==n?'now':'')+'"></i>').join('');
document.fonts.ready.then(()=>{const e=document.getElementById('h');let fs=170;while(e.scrollHeight>460&&fs>90){fs-=4;e.style.fontSize=fs+'px'}document.title='ready'});
</script></body></html>
