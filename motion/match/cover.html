<!doctype html><html><head><meta charset="utf-8"><title>Match cover</title>
<!-- Cover for SUNDAY LEAGUE LEGS DIE / AT 75 MINUTES (17 Nov), in the hour4-cover-16x9 layout: title left, drawn scene in a rounded panel right,
     ERN logo bottom left. Characters from the hour4 scenes' engine (motion/hour4-scenes.html). ?lines=2|3 -->
<style>
@font-face{font-family:'Barlow Condensed';font-weight:800;src:url(../fonts/BarlowCondensed-800-normal.woff2) format('woff2');}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0c1828}
.t{position:absolute;left:80px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center}
.l{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#fff;line-height:1.04;white-space:nowrap;width:max-content}
.hl{background:#d9473f;color:#fff;padding:0 .12em;display:inline-block;line-height:1.1;border-radius:.08em}
#panel{position:absolute;left:1040px;top:160px;width:840px;height:760px;border-radius:40px;overflow:hidden}
.logo{position:absolute;left:80px;bottom:56px;height:76px}
</style></head><body>
<div class="t" id="t"></div><canvas id="panel" width="840" height="760"></canvas><img class="logo" id="logo" src="../brand/ern-logo-white.png">
<script>
const D=Math.PI/180; const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.round(clamp(v*(1-k),0,255));return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`}
const css=()=>'#1f7ae0';
const cv=document.getElementById('panel'); let c=cv.getContext('2d');
const SKIN=['#f1c7a3','#d8a07a','#a86f4c','#7a4a2e','#f3d2b8','#c98b62']; const HAIR=['#2a1d15','#6b4528','#c99a5b','#1a1a1a','#8a3b1f','#d9c3a0'];
function seg(x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function leg(hx,hy,a,k){const kx=hx+44*Math.sin(a*D),ky=hy+44*Math.cos(a*D),s=a+k,ax=kx+44*Math.sin(s*D),ay=ky+44*Math.cos(s*D),f=s+90;
  return{kx,ky,ax,ay,fx:ax+15*Math.sin(f*D),fy:ay+15*Math.cos(f*D)}}
function arm(sx,sy,a,e){const ex=sx+32*Math.sin(a*D),ey=sy+32*Math.cos(a*D),b=a+e;return{ex,ey,hx:ex+30*Math.sin(b*D),hy:ey+30*Math.cos(b*D)}}
/* o: x, g (ground y), s (scale), f (1 faces right, -1 left), look, pose, plus colours; returns hand positions in screen space */
function person(o){
  const p=Object.assign({hipN:0,hipF:0,kneeN:0,kneeF:0,shN:6,shF:-6,elN:12,elF:12,lean:2,head:0,lift:0},o.pose||{});
  const L=Object.assign({top:'#8aa0b8',shorts:'#2c3a4d',skin:SKIN[1],hair:HAIR[0],shoe:'#ffffff'},o.look||{});
  c.save();c.translate(o.x,o.g);c.scale((o.f||1)*o.s,o.s);c.lineCap='round';c.lineJoin='round';
  if(o.alpha!=null)c.globalAlpha=o.alpha;
  const lN=leg(0,0,p.hipN,p.kneeN),lF=leg(0,0,p.hipF,p.kneeF);
  const hipY=-(Math.max(lN.ay,lF.ay,lN.fy,lF.fy)+7)-p.lift;
  const T=64,lx=Math.sin(p.lean*D),ly=-Math.cos(p.lean*D);
  const sx=(T-8)*lx,sy=hipY+(T-8)*ly,nx=T*lx,ny=hipY+T*ly;
  const hd=p.lean+p.head,hx=nx+19*Math.sin(hd*D),hy=ny-19*Math.cos(hd*D);
  const aN=arm(sx,sy,p.shN,p.elN),aF=arm(sx,sy,p.shF,p.elF);
  const drawLeg=(l,a,far)=>{const sk=far?shade(L.skin,.12):L.skin,sh=far?shade(L.shorts,.15):L.shorts;
    seg(0,hipY,l.kx,l.ky+hipY,19,sk);seg(l.kx,l.ky+hipY,l.ax,l.ay+hipY,16,sk);
    seg(0,hipY,l.kx*.55,l.ky*.55+hipY,25,sh);seg(l.ax,l.ay+hipY,l.fx,l.fy+hipY,14,far?shade(L.shoe,.12):L.shoe)};
  const drawArm=(a,far)=>{const sk=far?shade(L.skin,.12):L.skin;seg(sx,sy,a.ex,a.ey,13,sk);seg(a.ex,a.ey,a.hx,a.hy,12,sk);
    seg(sx,sy,lerp(sx,a.ex,.45),lerp(sy,a.ey,.45),17,far?shade(L.top,.15):L.top)};
  drawArm(aF,true);drawLeg(lF,0,true);
  seg(0,hipY-4,sx,sy,40,L.top);
  if(L.bib){c.save();c.translate(lerp(0,sx,.45),lerp(hipY,sy,.45));c.rotate(p.lean*D);c.fillStyle='#fff';c.fillRect(4,-15,17,30);c.fillStyle=css('blue');c.fillRect(4,-15,17,7);c.restore()}
  if(L.name){c.save();c.translate(lerp(0,sx,.32)+6*lx,lerp(hipY,sy,.32));c.rotate(p.lean*D);c.fillStyle='#0b0b0b';c.font='italic 800 21px Barlow';c.textAlign='center';c.textBaseline='middle';c.fillText(L.name,6,0);c.restore()}
  drawLeg(lN,0,false);
  if(o.prop==='sign'&&o.sign){} // signs are drawn by the caller at the hands
  drawArm(aN,false);
  c.fillStyle=L.skin;c.beginPath();c.arc(hx,hy,17,0,7);c.fill();
  c.fillStyle=L.hair;c.beginPath();c.arc(hx,hy,18,Math.PI*.92+hd*D,Math.PI*1.9+hd*D);c.closePath();c.fill();
  c.fillStyle='#1a1410';c.beginPath();c.arc(hx+9*Math.cos(hd*D)+3*Math.sin(hd*D),hy+3*Math.cos(hd*D)+9*Math.sin(hd*D)-2,2.6,0,7);c.fill();
  if(L.pony){c.beginPath();c.arc(hx-14*Math.cos(hd*D),hy+2,7,0,7);c.fill()}
  if(L.cap){c.fillStyle=L.cap;c.beginPath();c.arc(hx,hy,16.5,Math.PI*1.0+hd*D,Math.PI*2.0+hd*D);c.fill();seg(hx+4,hy-3,hx+24,hy-1,5,L.cap)}
  c.restore();
  const tf=(x,y)=>({x:o.x+(o.f||1)*o.s*x,y:o.g+o.s*y});
  return{handN:tf(aN.hx,aN.hy),handF:tf(aF.hx,aF.hy),head:tf(hx,hy),chest:tf(lerp(0,sx,.5),lerp(hipY,sy,.5))}}
function run(ph,amp=1,lean=9){const a=ph*Math.PI*2;return{hipN:32*amp*Math.sin(a),hipF:32*amp*Math.sin(a+Math.PI),
  kneeN:-(10+85*amp*Math.max(0,Math.cos(a))),kneeF:-(10+85*amp*Math.max(0,Math.cos(a+Math.PI))),
  shN:-30*amp*Math.sin(a),shF:30*amp*Math.sin(a),elN:88,elF:88,lean,lift:7*amp*Math.abs(Math.cos(a))}}
function mix(a,b,p){const o={};for(const k in a)o[k]=lerp(a[k],b[k]!=null?b[k]:a[k],p);return o}
const Q=new URLSearchParams(location.search), n=+(Q.get('lines')||3);
// ---- the scene: a wet Sunday league pitch, overcast ----
const W=840,H=760,GY=600;
c.fillStyle='#dfe4e8';c.fillRect(0,0,W,H);                         // overcast sky
const r=rng(11);
c.fillStyle='#b9c6b5';for(let x=-40;x<W+40;x+=46){c.beginPath();c.arc(x,330+r()*14,40+r()*18,0,7);c.fill()}   // far hedge
c.fillStyle='#9fb39a';c.fillRect(0,330,W,26);
c.fillStyle='#8a96a6';for(let x=40;x<W;x+=260){c.fillRect(x,250,6,110)}                                     // far fence posts
c.fillStyle='#7fae6f';c.fillRect(0,356,W,H-356);                    // pitch
for(let i=0;i<8;i++){c.fillStyle=i%2?'#78a868':'#86b576';c.beginPath();c.moveTo(-200+i*150,H);c.lineTo(-80+i*150,356);c.lineTo(-20+i*150,356);c.lineTo(-50+i*150,H);c.fill()}  // mown stripes
c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=6;c.beginPath();c.moveTo(0,402);c.lineTo(W,388);c.stroke();   // touchline
// mud and puddles
const mud=(x,y,rx,ry,a)=>{c.fillStyle=`rgba(110,84,58,${a})`;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()};
mud(330,612,170,30,.55);mud(250,630,90,16,.45);mud(560,660,120,20,.35);
c.fillStyle='rgba(205,220,232,.75)';c.beginPath();c.ellipse(640,700,90,14,0,0,7);c.fill();c.fillStyle='rgba(255,255,255,.5)';c.fillRect(600,697,40,3);
c.fillStyle='rgba(20,30,20,.18)';c.beginPath();c.ellipse(320,GY+4,95,12,0,0,7);c.fill();c.beginPath();c.ellipse(700,GY+2,80,10,0,0,7);c.fill();
// the tired player: plain off-white kit, muddy, hands on knees, facing right
const TIRED={hipN:34,hipF:24,kneeN:-44,kneeF:-36,shN:-24,shF:-30,elN:0,elF:2,lean:66,head:-36,lift:0};
const p1=person({x:300,g:GY,s:2.35,f:1,look:{top:'#ece8df',shorts:'#1f2a37',skin:SKIN[0],hair:HAIR[1],shoe:'#1a1a1a'},pose:TIRED});
// mud on the kit and socks
c.save();c.globalAlpha=.55;c.fillStyle='#7a5a3c';
[[p1.chest.x+18,p1.chest.y+30,26,12],[p1.chest.x-30,p1.chest.y+6,16,10],[p1.chest.x+40,p1.chest.y-20,12,8]].forEach(([x,y,a,b])=>{c.beginPath();c.ellipse(x,y,a,b,.4,0,7);c.fill()});
c.restore();
// breath clouds
c.fillStyle='rgba(255,255,255,.7)';[[p1.head.x+46,p1.head.y+14,14],[p1.head.x+70,p1.head.y+6,10],[p1.head.x+88,p1.head.y+2,7]].forEach(([x,y,R])=>{c.beginPath();c.arc(x,y,R,0,7);c.fill()});
// the opponent: red kit, sprinting in from the right onto the ball
const RUN=run(.12,1.15,14);
person({x:700,g:GY,s:2.0,f:-1,look:{top:'#d9473f',shorts:'#d9473f',skin:SKIN[2],hair:HAIR[3],shoe:'#f5f5f5'},pose:RUN});
// the ball rolling past, with spray
const bx=520,by=GY-22,R=22;
c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=5;c.lineCap='round';[[0,-12],[8,2],[0,14]].forEach(([dx,dy])=>{c.beginPath();c.moveTo(bx-40+dx,by+dy);c.lineTo(bx-90+dx,by+dy);c.stroke()});
c.fillStyle='rgba(205,220,232,.9)';[[bx-30,by+18,5],[bx-48,by+12,4],[bx-60,by+20,3]].forEach(([x,y,r2])=>{c.beginPath();c.arc(x,y,r2,0,7);c.fill()});
c.fillStyle='#fff';c.beginPath();c.arc(bx,by,R,0,7);c.fill();c.strokeStyle='#1d2433';c.lineWidth=3;c.stroke();
c.fillStyle='#1d2433';const pent=(x,y,s)=>{c.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;c.lineTo(x+s*Math.cos(a),y+s*Math.sin(a))}c.closePath();c.fill()};
pent(bx,by,7);pent(bx+14,by-12,5);pent(bx-15,by+8,5);pent(bx+12,by+13,4);
c.fillStyle='rgba(110,84,58,.5)';c.beginPath();c.ellipse(bx+6,by+14,10,4,0,0,7);c.fill();
// ---- the title ----
const t=document.getElementById('t');
const add=(h,fs)=>{const d=document.createElement('div');d.className='l';d.innerHTML=h;d.style.fontSize=fs+'px';t.appendChild(d);return d};
const TT={a:[['ORANGES <span class="hl">WON\'T</span> SAVE',120],['YOUR LEGS AT 75 MINS',150],['(SUNDAY LEAGUE)',110]],
          b:[['SUNDAY LEAGUE LEGS,',120],['PREMIER LEAGUE <span class="hl">FUEL</span>',150],['(STILL FLYING AT 85)',110]]};
if(Q.get('theme')==='white'){document.body.style.background='#fff';document.querySelectorAll('.l').forEach(()=>{});
  const st=document.createElement('style');st.textContent='.l{color:#000!important}#panel{box-shadow:0 10px 40px rgba(13,23,38,.18)}';document.head.appendChild(st);
  document.getElementById('logo').src='../brand/ern-logo.png';}
let ls;
if(Q.get('t')) ls=TT[Q.get('t')].map(([h,fs])=>add(h,fs));
else { ls=[add('SUNDAY LEAGUE LEGS <span class="hl">DIE</span>',120),add('AT 75 MINUTES',150)];
  if(n===3) ls.push(add('(EVEN IN THE PREMIER LEAGUE)',84)); }
document.fonts.load("800 100px 'Barlow Condensed'").then(()=>{ls.forEach(d=>{let fs=parseFloat(d.style.fontSize);while(d.getBoundingClientRect().width>900&&fs>30){fs-=2;d.style.fontSize=fs+'px'}});document.title='fitted'});
</script></body></html>
