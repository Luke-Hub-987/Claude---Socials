<!doctype html><html><head><meta charset="utf-8"><title>Elite running skills carousel</title>
<!-- 10/10 ELITE RUNNING SKILLS / YOU CAN LEARN IN 1 DAY (Luke, 25-26 Nov). slow internet club's format.
     ?n=1..7, ?h=1440 (TikTok photo, 3:4) or ?h=1350 (Instagram, 4:5). Slide 4 is the website slide. -->
<style>
@font-face{font-family:Anton;src:url(../fonts/Anton-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;src:url(../fonts/Inter-400-normal.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;background:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden;position:relative;color:#0b0b0b}
.anton{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:-.5px}
.page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
/* cover */
.score{font-size:330px;line-height:.92;color:#2342c8}
.cl{font-size:92px;line-height:1.0;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:940px}
.grid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}
.small{font-size:30px;color:#555;margin-top:18px}
/* skill slides */
.h1{font-size:118px;line-height:1.0;text-align:center}
.thumb{width:940px;aspect-ratio:16/9;object-fit:cover;border-radius:26px;display:block;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.meta{width:940px;display:flex;gap:22px;align-items:center;margin-top:22px}
.av{width:74px;height:74px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:30px}
.vt{font-size:34px;font-weight:700;line-height:1.2}
.vs{font-size:28px;color:#666;margin-top:4px}
.pay{font-size:56px;font-weight:700;letter-spacing:-.8px;text-align:center}
.count{position:absolute;right:46px;top:46px;background:#9aa0a6;color:#fff;font-size:30px;font-weight:600;border-radius:30px;padding:8px 22px}
.handle{position:absolute;bottom:34px;width:100%;text-align:center;font-size:24px;color:#9a9a9a}
/* website slide: the clock card, redrawn from engineroomnutrition.com */
.site{width:940px;background:#eef3fa;border-radius:26px;padding:34px;display:flex;flex-direction:column;gap:22px}
.clock{background:#0f1730;border-radius:24px;padding:28px 34px 22px}
.ct{color:#c9d2e3;font-size:26px;letter-spacing:5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.goal{background:#f5c04a;color:#1b1b1b;border-radius:10px;padding:4px 14px;letter-spacing:2px}
.big{color:#f5c04a;font-size:150px;line-height:1.05;margin-top:10px}.big small{font-size:70px;color:#c99a2e}
.bar{height:16px;border-radius:8px;background:#2b3557;position:relative;margin:18px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:31%;background:#f5c04a;border-radius:8px}
.bar b{position:absolute;left:31%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;border:7px solid #f5c04a}
.ticks{display:flex;justify-content:space-between;color:#8794b3;font-size:24px;font-weight:700}
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sg{background:#dfe7f3;border-radius:18px;padding:16px 8px;text-align:center;color:#5b6577;font-size:22px;font-weight:700;letter-spacing:2px}
.sg div{font-size:46px;letter-spacing:0;color:#0f1730;filter:blur(8px)}
.sg svg{display:block;margin:6px auto 0}
.sg.on{background:#3d7be0;color:#dce8ff}.sg.on div{color:#fff;filter:none}
.pill{display:flex;align-items:center;gap:20px;background:#111;color:#fff;border-radius:22px;padding:18px 26px;margin-top:22px}
.pill .lg{width:70px;height:70px;border-radius:14px;background:#fff;color:#000;font-family:Anton;font-size:30px;display:flex;align-items:center;justify-content:center}
.pill .tx{flex:1}.pill .t1{font-size:30px;font-weight:700}.pill .t2{font-size:23px;color:#bbb}
.pill .op{background:#2f80ed;border-radius:30px;padding:10px 26px;font-size:28px;font-weight:700}
</style></head><body><div class="page" id="p"></div>
<script>
const Q=new URLSearchParams(location.search), H=+Q.get('h')||1440, n=+Q.get('n')||1;
document.body.style.height=H+'px';
const T='thumbs/';
// [headline line 1, line 2, colour, thumb, avatar colour, initials, video title, channel · views · length, payoff]
const S={
 2:['RUN WITHOUT','GASPING FOR AIR','#2342c8','11-pxn34Lx3CYY.jpg','#3a3f47','NR','How to Breathe so Running Feels EASIER!','Nicklas Rossner · 3.8M views','9 minutes. 5 breathing fixes.'],
 3:['RUN WITH LIGHT,','QUIET FEET','#c0392b','02-_kGESn8ArrU.jpg','#e4342b','GTN','How To Run Properly | Running Technique Explained','Global Triathlon Network · 4.6M views','10 minutes. Form, rebuilt.'],
 5:['HOLD A CHAT ON','EVERY EASY RUN','#2e7d4f','03-VAsYTcBdtOg.jpg','#6b4f3a','SS','I Tried Zone 2 Training for 3 Months','Shervin Shares · 4.4M views','13 minutes. Zone 2, explained.'],
 6:['TAKE QUICKER,','LIGHTER STEPS','#d35400','04-eacl52qzr4E.jpg','#1f6fd1','BP','How to Improve & Increase Running Cadence','Ben Parkes · 821K views','7 minutes. Cadence, sorted.'],
 7:['STOP YOUR HEEL','SLIPPING MID-RUN','#8a6a2f','05-jG_XzEjD9Ls.jpg','#2b2b2b','PF','How to tie a heel lock (Racer\'s Loop)','Profeet · 784K views','1 minute. One extra loop.'],
};
const p=document.getElementById('p');
const gap=H>1400?1:0.82;
if(n===1){
  const big=H>1400;
  p.innerHTML=`${Q.get('cover')==='b'
    ? `<img src="photos/mantz-cutout.png" style="position:absolute;left:50%;transform:translateX(-48%);top:${big?120:75}px;height:${big?560:520}px;z-index:2">`
    : `<img src="photos/lacing-cutout.png" style="position:absolute;left:50%;transform:translateX(-50%);top:${big?92:58}px;height:${big?490:430}px;z-index:2">`}
  <div style="height:${big?550:475}px"></div>
  <div class="anton score" style="position:relative;z-index:1">10/10</div>
  <div class="anton cl" style="margin-top:14px"><span style="color:#d63a2f">ELITE</span> RUNNING SKILLS<br>YOU CAN LEARN<br>IN 1 DAY</div>
  <div class="small" style="font-size:34px;color:#444">(part 1)</div>
  <div class="small" style="font-size:28px;margin-top:8px">(save this for your next easy run)</div>`;
} else if(n===4){
  p.innerHTML=`<div style="height:${Math.round(H*.075)}px"></div>
  <div class="anton h1">KNOW YOUR TIME<br><span style="color:#2f6fd6">AT EVERY 10K SIGN</span></div>
  <div style="height:${Math.round(46*gap)}px"></div>
  <div class="site"><div class="clock"><div class="ct"><span>● YOUR FINISH TIME</span><span class="goal">GOAL</span></div>
    <div class="anton big">3:45<small>:00</small></div><div class="bar"><i></i><b></b></div>
    <div class="ticks"><span>3:00</span><span>4:15</span><span>5:30</span></div></div>
    <div class="signs"><div class="sg on">10K SIGN<div>54:00</div></div><div class="sg">20K SIGN<div>1:48</div><svg width="34" height="40" viewBox="0 0 34 40"><path d="M8 17V11a9 9 0 0 1 18 0v6" fill="none" stroke="#b08a2e" stroke-width="4"/><rect x="2" y="17" width="30" height="21" rx="4" fill="#e0b84a"/></svg></div><div class="sg">30K SIGN<div>2:41</div><svg width="34" height="40" viewBox="0 0 34 40"><path d="M8 17V11a9 9 0 0 1 18 0v6" fill="none" stroke="#b08a2e" stroke-width="4"/><rect x="2" y="17" width="30" height="21" rx="4" fill="#e0b84a"/></svg></div><div class="sg">40K SIGN<div>3:34</div><svg width="34" height="40" viewBox="0 0 34 40"><path d="M8 17V11a9 9 0 0 1 18 0v6" fill="none" stroke="#b08a2e" stroke-width="4"/><rect x="2" y="17" width="30" height="21" rx="4" fill="#e0b84a"/></svg></div></div></div>
  <div class="pay" style="margin-top:${Math.round(40*gap)}px">30 seconds. Unlock all 4, free.</div>
  <div class="pill" style="width:940px"><div class="lg">ERN</div><div class="tx"><div class="t1">Comment PLAN for yours</div><div class="t2">engineroomnutrition.com · 100+ runners have theirs</div></div><div class="op">FREE</div></div>`;
} else {
  const [a,b,c,f,av,ini,vt,vs,pay]=S[n];
  p.innerHTML=`<div style="height:${Math.round(H*.075)}px"></div>
  <div class="anton h1">${a}<br><span style="color:${c}">${b}</span></div>
  <div style="height:${Math.round(56*gap)}px"></div>
  <img class="thumb" src="${T+f}">
  <div class="meta"><div class="av" style="background:${av}">${ini}</div><div><div class="vt">${vt}</div><div class="vs">${vs}</div></div></div>
  <div class="pay" style="margin-top:${Math.round(H>1400?110:70)}px">${pay}</div>`;
}
if(n>1) p.insertAdjacentHTML('beforeend',`<div class="count">${n}/7</div>`);
if(!(n===1&&H<1400)) p.insertAdjacentHTML('beforeend',`<div class="handle">@engineroomnutrition</div>`);
if(n===1&&H<1400){document.querySelector('.score').style.fontSize='290px';}
</script></body></html>
